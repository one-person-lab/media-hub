<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!--
    创作者增长平台 Logo ·「点阵 M」
    符号：字母 M（自媒体 Media 的首字母）用方格点阵排出来，中间两列让空——那道空缺就是原来的书脊折线。
    格子 36 单位、行距 46、圆角 9，铺在 512×512 的墨底（#0D0D0D，圆角 112）上。
    明暗：左上最亮（1.0）斜向收到右下最暗（0.08），靠灰阶撑厚度，不再叠颜色。
    单一来源：本文件 → extension/icons/icon.svg（浏览器插件）与
    videos/promo-video-mediahub/public/brand/logo.svg（宣传片落版）同源同步；
    改品牌图形只改这里，再同步上述两处并重导插件 PNG（见 extension/README.md）。
  -->
  <rect width="512" height="512" rx="112" fill="#0D0D0D"/>
  <g fill="#FFFFFF">
    <!-- 第1行：左右腿顶（中间留缺口） -->
    <rect x="100" y="100" width="36" height="36" rx="9" opacity="1"/>
    <rect x="146" y="100" width="36" height="36" rx="9" opacity="0.92"/>
    <rect x="330" y="100" width="36" height="36" rx="9" opacity="0.62"/>
    <rect x="376" y="100" width="36" height="36" rx="9" opacity="0.54"/>
    <!-- 第2行：左右腿（缺口延续） -->
    <rect x="100" y="146" width="36" height="36" rx="9" opacity="0.92"/>
    <rect x="146" y="146" width="36" height="36" rx="9" opacity="0.85"/>
    <rect x="330" y="146" width="36" height="36" rx="9" opacity="0.54"/>
    <rect x="376" y="146" width="36" height="36" rx="9" opacity="0.46"/>
    <!-- 第3行：V 两臂斜切入（中央留空） -->
    <rect x="100" y="192" width="36" height="36" rx="9" opacity="0.85"/>
    <rect x="146" y="192" width="36" height="36" rx="9" opacity="0.77"/>
    <rect x="192" y="192" width="36" height="36" rx="9" opacity="0.69"/>
    <rect x="284" y="192" width="36" height="36" rx="9" opacity="0.54"/>
    <rect x="330" y="192" width="36" height="36" rx="9" opacity="0.46"/>
    <rect x="376" y="192" width="36" height="36" rx="9" opacity="0.39"/>
    <!-- 第4行：V 谷底（中央收点） -->
    <rect x="100" y="238" width="36" height="36" rx="9" opacity="0.77"/>
    <rect x="146" y="238" width="36" height="36" rx="9" opacity="0.69"/>
    <rect x="192" y="238" width="36" height="36" rx="9" opacity="0.62"/>
    <rect x="238" y="238" width="36" height="36" rx="9" opacity="0.54"/>
    <rect x="284" y="238" width="36" height="36" rx="9" opacity="0.46"/>
    <rect x="330" y="238" width="36" height="36" rx="9" opacity="0.39"/>
    <rect x="376" y="238" width="36" height="36" rx="9" opacity="0.31"/>
    <!-- 第5行：左右腿 -->
    <rect x="100" y="284" width="36" height="36" rx="9" opacity="0.69"/>
    <rect x="146" y="284" width="36" height="36" rx="9" opacity="0.62"/>
    <rect x="330" y="284" width="36" height="36" rx="9" opacity="0.31"/>
    <rect x="376" y="284" width="36" height="36" rx="9" opacity="0.23"/>
    <!-- 第6行：左右腿 -->
    <rect x="100" y="330" width="36" height="36" rx="9" opacity="0.62"/>
    <rect x="146" y="330" width="36" height="36" rx="9" opacity="0.54"/>
    <rect x="330" y="330" width="36" height="36" rx="9" opacity="0.23"/>
    <rect x="376" y="330" width="36" height="36" rx="9" opacity="0.16"/>
    <!-- 第7行：左右腿底 -->
    <rect x="100" y="376" width="36" height="36" rx="9" opacity="0.54"/>
    <rect x="146" y="376" width="36" height="36" rx="9" opacity="0.46"/>
    <rect x="330" y="376" width="36" height="36" rx="9" opacity="0.16"/>
    <rect x="376" y="376" width="36" height="36" rx="9" opacity="0.08"/>
  </g>
</svg>

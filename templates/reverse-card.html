<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  /* 复刻爆款封面：奶油底 + 大号黑色粗体标题 + 黄色荧光笔划过关键词 + 下方编号清单
     画布 1242×1660（3:4，小红书/抖音/公众号封面通用），截图按 CSS 像素 1:1 输出 */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1242px; height: 1660px; }
  body {
    background: #F5EEDD;
    color: #1A1A1A;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft Yahei", sans-serif;
    padding: 128px 104px 104px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .series {
    font-size: 34px;
    font-weight: 600;
    letter-spacing: 4px;
    color: #A08A5A;
    margin-bottom: 40px;
  }
  h1 {
    font-size: 104px;
    font-weight: 800;
    line-height: 1.28;
    letter-spacing: 1px;
    margin-bottom: 72px;
  }
  /* 黄色荧光笔：文字下半部一条高亮带，模拟马克笔划过 */
  .hl {
    background: linear-gradient(180deg, transparent 58%, #F6D34A 58%, #F6D34A 96%, transparent 96%);
    padding: 0 6px;
    border-radius: 2px;
  }
  .rule { width: 100%; height: 3px; background: #1A1A1A; opacity: .85; margin-bottom: 64px; }
  ol { list-style: none; flex: 1; }
  ol li {
    display: flex;
    align-items: baseline;
    font-size: 52px;
    font-weight: 500;
    line-height: 1.4;
    margin-bottom: 46px;
  }
  ol li .no {
    flex: 0 0 auto;
    width: 72px;
    font-weight: 800;
    color: #C8A227;
  }
  ol li:last-child { margin-bottom: 0; }
  .foot {
    font-size: 30px;
    font-weight: 600;
    letter-spacing: 2px;
    color: #8A7A55;
    margin-top: 48px;
  }
</style>
</head>
<body>
  <div class="series">__SERIES__</div>
  <h1>__TITLE__</h1>
  <div class="rule"></div>
  <ol>__ITEMS__</ol>
  <div class="foot">__FOOT__</div>
</body>
</html>

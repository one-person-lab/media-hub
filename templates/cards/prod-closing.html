<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1242px; height: 1660px; }
  body {
    background:
      radial-gradient(1200px 760px at 50% -14%, #2a2040 0%, rgba(42,32,64,0) 68%),
      radial-gradient(760px 520px at 8% 82%, #241a38 0%, rgba(36,26,56,0) 70%),
      linear-gradient(180deg, #0b0714 0%, #171122 55%, #0b0714 100%);
    color: #fff;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    overflow: hidden; position: relative;
  }
  .blob { position: absolute; border-radius: 50%; }
  .b1 { width: 460px; height: 460px; left: -160px; top: -150px; background: #a78bfa; opacity: .14; }
  .b2 { width: 300px; height: 300px; right: -100px; bottom: 220px; background: #ffd166; opacity: .08; }

  .wrap { position: absolute; left: 100px; right: 100px; top: 130px; }
  .kicker { font-size: 28px; letter-spacing: 3px; color: #a78bfa; }
  .title { margin-top: 22px; }
  .ln { display: block; }
  .title b { font-size: __ZH__; line-height: 1.32; font-weight: 900; letter-spacing: -1px; }
  .title b.hot { color: #ffd166; }
  .title b.pale { color: #ff8b6a; }
  .echo { margin-top: 30px; font-size: __ECHOSIZE__; line-height: 1.55; color: #b3a9d4; }
  .echo b.em { color: #fff; font-weight: 700; }

  .rows { margin-top: 60px; display: flex; flex-direction: column; gap: 34px; }
  .item { display: flex; align-items: baseline; gap: 18px; }
  .zh { font-size: 42px; line-height: 1.5; color: #f2eeff; font-weight: 600; }
  .zh b.em { color: #ffd166; font-weight: 800; }
  .item::before { content: ""; flex: 0 0 auto; width: 14px; height: 14px; border-radius: 50%;
    background: #a78bfa; transform: translateY(-6px); }
  .src { font-size: 26px; color: #8d82ac; }
  .en { display: none; }

  .cta {
    position: absolute; left: 100px; right: 100px; bottom: 236px;
    background: linear-gradient(180deg, #ffd979 0%, #f7c451 100%);
    color: #241a38; border-radius: 28px; padding: 40px 44px; text-align: center;
    font-size: 46px; font-weight: 900; letter-spacing: 1px;
    box-shadow: 0 26px 70px rgba(255,209,102,.24);
  }
  .cite { position: absolute; left: 100px; right: 100px; bottom: 176px; text-align: center;
    font-size: 29px; color: #8d82ac; }
  .cite b.em { color: #c9c1e6; font-weight: 700; }

  .foot {
    position: absolute; left: 100px; right: 100px; bottom: 58px;
    display: flex; justify-content: space-between; font-size: 27px; color: #6f6488;
  }
</style>
</head>
<body>
  <div class="blob b1"></div><div class="blob b2"></div>
  <div class="wrap">
    <div class="kicker">__KICKER__</div>
    <div class="title">__TITLE__</div>
    <div class="echo">__ECHO__</div>
    <div class="rows">__ROWS__</div>
  </div>
  <div class="cta">__CTA__</div>
  <div class="cite">__SRC__</div>
  <div class="foot"><span>__BRAND__</span><span>__PAGENO__</span></div>
</body>
</html>

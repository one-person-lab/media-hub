<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1242px; height: 1660px; }
  body {
    background:
      radial-gradient(1100px 700px at 84% -6%, #2a2040 0%, rgba(42,32,64,0) 70%),
      radial-gradient(900px 620px at -12% 62%, #241a38 0%, rgba(36,26,56,0) 70%),
      linear-gradient(180deg, #0b0714 0%, #171122 55%, #0b0714 100%);
    color: #fff;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    overflow: hidden; position: relative;
  }
  .blob { position: absolute; border-radius: 50%; }
  .b1 { width: 440px; height: 440px; right: -150px; top: -140px; background: #a78bfa; opacity: .15; }
  .b2 { width: 300px; height: 300px; left: -120px; top: 640px; background: #ff8b6a; opacity: .12; }
  .b3 { width: 220px; height: 220px; right: 60px; bottom: -60px; background: #6bc5f0; opacity: .1; }

  .wrap { position: absolute; left: 88px; right: 88px; top: 104px; }
  .kicker {
    display: inline-block; font-size: 29px; letter-spacing: 2px; color: #c9c1e6;
    border: 2px solid rgba(167,139,250,.42); border-radius: 999px; padding: 10px 26px;
  }
  .title { margin-top: 40px; }
  .title .ln { display: block; }
  .title b { font-size: __ZH__; line-height: 1.3; font-weight: 900; letter-spacing: -1px; }
  .title b.hot { color: #ffd166; }
  .title b.pale { color: #ff8b6a; }
  .echo { margin-top: 28px; font-size: __ECHOSIZE__; line-height: 1.55; color: #b3a9d4; }
  .echo b.em { color: #fff; font-weight: 700; }

  .chips { margin-top: 34px; display: flex; flex-wrap: wrap; gap: 16px; }
  .chips .item { display: flex; align-items: baseline; }
  .chips .zh {
    font-size: 29px; color: #e9e3fb; background: rgba(167,139,250,.14);
    border: 2px solid rgba(167,139,250,.3); border-radius: 14px; padding: 12px 22px;
  }
  .chips .src, .chips .en { display: none; }

  /* 手机居中偏下，压在文字块下面 —— 封面主视觉就是真机界面本身 */
  .glow { position: absolute; left: 50%; bottom: 90px; width: 760px; height: 760px;
    transform: translateX(-50%); background: radial-gradient(circle, rgba(255,209,102,.15) 0%, rgba(255,209,102,0) 62%); }
  .stage { position: absolute; left: 0; right: 0; bottom: 116px; display: flex; justify-content: center; }
  .phone {
    width: 424px; height: 884px;
    border: 4px solid rgba(167,139,250,.38); border-radius: 56px; overflow: hidden; background: #171122;
    transform: rotate(-2.5deg);
    box-shadow: 0 44px 120px rgba(0,0,0,.72), 0 0 130px rgba(167,139,250,.2);
  }
  .phone img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }

  .foot {
    position: absolute; left: 88px; right: 88px; bottom: 52px;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 27px; color: #6f6488;
  }
</style>
</head>
<body>
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
  <div class="glow"></div>
  <div class="wrap">
    <div class="kicker">__KICKER__</div>
    <div class="title">__TITLE__</div>
    <div class="echo">__ECHO__</div>
    <div class="chips">__ROWS__</div>
  </div>
  <div class="stage"><div class="phone"><img src="__IMG__" alt=""></div></div>
  <div class="foot"><span>__BRAND__</span><span>__PAGENO__</span></div>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1242px; height: 1660px; }
  body {
    background: var(--page, #FFFDF8);
    color: var(--ink, #111);
    font-family: var(--font, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif);
    overflow: hidden;
  }

  /* 仿手机截图：状态栏 + 返回行 + 日期，三样把「这是一篇真笔记」的错觉撑起来。
     源爆款里这一类的完读率最高，因为它不像广告也不像排版作品，像随手记下来的东西。 */
  .status {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 34px 60px 0;
    font-size: 34px;
    font-weight: 700;
    letter-spacing: 1px;
  }
  /* 右边的信号/电量是画的，不引图标库：卡片是静态 HTML，跟着界面那套 lucide 走不了 */
  .status .glyphs { display: flex; align-items: center; gap: 14px; }
  .bars { display: flex; align-items: flex-end; gap: 5px; }
  .bars i { display: block; width: 9px; background: currentColor; border-radius: 2px; }
  .bars i:nth-child(1) { height: 14px; }
  .bars i:nth-child(2) { height: 20px; }
  .bars i:nth-child(3) { height: 26px; }
  .bars i:nth-child(4) { height: 32px; }
  .wifi { width: 34px; height: 26px; border: 6px solid currentColor; border-bottom-color: transparent; border-radius: 50% 50% 0 0 / 100% 100% 0 0; }
  .cell { width: 56px; height: 28px; border: 4px solid currentColor; border-radius: 8px; position: relative; }
  .cell::after { content: ""; position: absolute; left: 3px; top: 3px; bottom: 3px; width: 62%; background: currentColor; border-radius: 4px; }

  .nav {
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 40px 60px 0;
    font-size: 40px;
    font-weight: 600;
  }
  .nav .back { font-size: 52px; line-height: 1; transform: scaleY(1.3); }
  .nav .tools { margin-left: auto; display: flex; gap: 22px; }
  .nav .tools i { width: 44px; height: 44px; border: 5px solid currentColor; border-radius: 50%; display: block; }

  .date:empty { display: none; }
  .date { margin-top: 44px; text-align: center; font-size: 34px; color: var(--ink-3, #9A917C); letter-spacing: 1px; }

  .wrap { padding: 0 60px; }
  .title { margin-top: 40px; }
  .title .ln { display: block; }
  .title b {
    display: inline-block;
    font-size: 96px;
    font-weight: 800;
    line-height: 1.24;
    letter-spacing: 1px;
    padding: 2px 10px;
  }
  .title b.hot { background: var(--accent, #FAE79B); color: var(--accent-ink, #111); }
  .title b.pale { background: var(--surface-2, #F2EADA); }

  /* 灰底段落块 = 截图里那段「正文开头」，是这一版式最像真东西的地方 */
  .echo:empty { display: none; }
  .echo {
    margin-top: 52px;
    background: var(--surface-2, #F2EADA);
    border-radius: 26px;
    padding: 40px 44px;
    font-size: 42px;
    font-weight: 400;
    line-height: 1.78;
    letter-spacing: 0.5px;
  }
  .echo b.em { font-weight: 800; }

  /* 条目：小标题加粗 + 正文常规，跟截图里「习惯1：复盘」那种写法对齐 */
  .item { margin-top: 56px; }
  .item .zh { font-size: 46px; font-weight: 800; line-height: 1.55; }
  .item .zh .em { font-weight: 800; }
  .item .zh .src { font-weight: 500; color: var(--ink-4, #7C7360); }
  .item .en { margin-top: 14px; font-size: 36px; font-weight: 400; line-height: 1.62; color: var(--ink-2, #6B6350); }

  .foot {
    position: absolute;
    left: 60px;
    right: 60px;
    bottom: 56px;
    display: flex;
    justify-content: space-between;
    font-size: 30px;
    color: var(--ink-3, #9A917C);
  }
</style>
</head>
<body>
  <div class="status">
    <span>15:31</span>
    <span class="glyphs"><span class="bars"><i></i><i></i><i></i><i></i></span><span class="wifi"></span><span class="cell"></span></span>
  </div>
  <div class="nav">
    <span class="back">‹</span>
    <span>__KICKER__</span>
    <span class="tools"><i></i><i></i></span>
  </div>
  <div class="wrap">
    <div class="date">__SRC__</div>
    <div class="title">__TITLE__</div>
    <div class="echo">__ECHO__</div>
    __ROWS__
  </div>
  <div class="foot"><span>__BRAND__</span><span>__PAGENO__</span></div>
</body>
</html>

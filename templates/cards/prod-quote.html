<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1242px; height: 1660px; }
  body {
    background:
      radial-gradient(1000px 660px at 90% -6%, #2a2040 0%, rgba(42,32,64,0) 68%),
      radial-gradient(820px 560px at -8% 74%, #241a38 0%, rgba(36,26,56,0) 70%),
      linear-gradient(180deg, #0b0714 0%, #171122 55%, #0b0714 100%);
    color: #fff;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    overflow: hidden; position: relative;
  }
  .blob { position: absolute; border-radius: 50%; }
  .b1 { width: 400px; height: 400px; right: -130px; top: 620px; background: #a78bfa; opacity: .12; }
  .b2 { width: 240px; height: 240px; left: -90px; top: 180px; background: #ff8b6a; opacity: .1; }

  .head { position: absolute; left: 88px; right: 88px; top: 96px; }
  .kicker { font-size: 28px; letter-spacing: 3px; color: #a78bfa; }
  .title { margin-top: 16px; }
  .ln { display: block; }
  .title b { font-size: __ZH__; line-height: 1.3; font-weight: 900; letter-spacing: -1px; }
  .title b.hot { color: #ffd166; }
  .title b.pale { color: #ff8b6a; }

  /* 题目原文按抽到的顺序竖排，每条一张卡，左边一条色带区分题型 */
  .deck { position: absolute; left: 88px; right: 88px; top: __GAP__; display: flex; flex-direction: column; gap: 30px; }
  .deck .item {
    position: relative; background: #201830; border: 2px solid rgba(167,139,250,.22);
    border-radius: 28px; padding: 30px 36px 28px 44px; overflow: hidden;
  }
  .deck .item::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 10px; background: #a78bfa;
  }
  .deck .item:nth-child(2)::before { background: #ff8b6a; }
  .deck .item:nth-child(3)::before { background: #6bc5f0; }
  .deck .item:nth-child(4)::before { background: #5dcaa5; }
  .deck .item:nth-child(5)::before { background: #ffd166; }
  .deck .zh { font-size: 42px; line-height: 1.42; font-weight: 700; color: #f6f3ff; }
  .deck .zh b.em { color: #ffd166; font-weight: 800; }
  .deck .src { display: inline-block; margin-top: 14px; font-size: 25px; color: #a78bfa;
    background: rgba(167,139,250,.13); border-radius: 999px; padding: 6px 20px; }
  .deck .en { display: none; }

  .cite { position: absolute; left: 88px; right: 88px; bottom: 112px; font-size: 29px; color: #8d82ac; }
  .cite b.em { color: #c9c1e6; font-weight: 700; }

  .foot {
    position: absolute; left: 88px; right: 88px; bottom: 52px;
    display: flex; justify-content: space-between; font-size: 27px; color: #6f6488;
  }
</style>
</head>
<body>
  <div class="blob b1"></div><div class="blob b2"></div>
  <div class="head">
    <div class="kicker">__KICKER__</div>
    <div class="title">__TITLE__</div>
  </div>
  <div class="deck">__ROWS__</div>
  <div class="cite">__SRC__</div>
  <div class="foot"><span>__BRAND__</span><span>__PAGENO__</span></div>
</body>
</html>
